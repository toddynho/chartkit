<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartKit - Beautiful Minimal Charts</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useMemo, useRef, useCallback } = React;

    // ============================================
    // THEME SYSTEM
    // ============================================
    const themes = {
      'monitor-dark': {
        name: 'Monitor Dark',
        bg: '#0c0c0c',
        bgSecondary: '#141414',
        bgCard: '#1a1a1a',
        text: '#ffffff',
        textSecondary: '#6b6b6b',
        textMuted: '#404040',
        border: '#262626',
        gridLine: '#1f1f1f',
        colors: ['#4ade80', '#38bdf8', '#a78bfa', '#fb923c', '#f472b6'],
        accent: '#22d3ee',
        positive: '#4ade80',
        negative: '#f87171',
      },
      'turbo': {
        name: 'Turbo',
        bg: '#0a0a0a',
        bgSecondary: '#111111',
        bgCard: '#171717',
        text: '#fafafa',
        textSecondary: '#737373',
        textMuted: '#404040',
        border: '#262626',
        gridLine: '#1a1a1a',
        colors: ['#10b981', '#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899'],
        accent: '#06b6d4',
        positive: '#10b981',
        negative: '#ef4444',
      },
      'cloudflare': {
        name: 'Cloudflare',
        bg: '#ffffff',
        bgSecondary: '#f9fafb',
        bgCard: '#ffffff',
        text: '#111827',
        textSecondary: '#6b7280',
        textMuted: '#9ca3af',
        border: '#e5e7eb',
        gridLine: '#f3f4f6',
        colors: ['#10b981', '#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899'],
        accent: '#f59e0b',
        positive: '#10b981',
        negative: '#ef4444',
        baseline: '#ec4899',
      },
      'vercel': {
        name: 'Vercel',
        bg: '#000000',
        bgSecondary: '#0a0a0a',
        bgCard: '#111111',
        text: '#ededed',
        textSecondary: '#888888',
        textMuted: '#444444',
        border: '#333333',
        gridLine: '#222222',
        colors: ['#50e3c2', '#0070f3', '#7928ca', '#f5a623', '#ff0080'],
        accent: '#ffffff',
        positive: '#50e3c2',
        negative: '#ee0000',
      },
      'github': {
        name: 'GitHub',
        bg: '#0d1117',
        bgSecondary: '#161b22',
        bgCard: '#21262d',
        text: '#f0f6fc',
        textSecondary: '#8b949e',
        textMuted: '#484f58',
        border: '#30363d',
        gridLine: '#21262d',
        colors: ['#3fb950', '#58a6ff', '#a371f7', '#d29922', '#f85149'],
        accent: '#58a6ff',
        positive: '#3fb950',
        negative: '#f85149',
      },
    };

    // ============================================
    // UTILITIES
    // ============================================
    const linearScale = (domain, range) => {
      const [d0, d1] = domain;
      const [r0, r1] = range;
      const ratio = (r1 - r0) / (d1 - d0 || 1);
      return (value) => r0 + (value - d0) * ratio;
    };

    const inverseLinearScale = (domain, range) => {
      const [d0, d1] = domain;
      const [r0, r1] = range;
      const ratio = (d1 - d0) / (r1 - r0 || 1);
      return (value) => d0 + (value - r0) * ratio;
    };

    // Interpolate Y value at a given X position
    const interpolateY = (data, dataKey, xPos, xScale, yScale) => {
      const xInverse = inverseLinearScale([0, data.length - 1], [0, xScale(data.length - 1)]);
      const dataIndex = xInverse(xPos);
      
      const i0 = Math.floor(dataIndex);
      const i1 = Math.min(Math.ceil(dataIndex), data.length - 1);
      
      if (i0 === i1) {
        return { y: yScale(data[i0][dataKey]), value: data[i0][dataKey] };
      }
      
      const t = dataIndex - i0;
      const v0 = data[i0][dataKey];
      const v1 = data[i1][dataKey];
      const interpolatedValue = v0 + (v1 - v0) * t;
      
      return { y: yScale(interpolatedValue), value: interpolatedValue };
    };

    // ============================================
    // SPARKLINE
    // ============================================
    const Sparkline = ({ 
      data, 
      dataKey = 'value',
      width = 120, 
      height = 32, 
      theme,
      color,
      glow = false,
      fill = false,
      strokeWidth = 1.5,
    }) => {
      const t = themes[theme];
      const lineColor = color || t.colors[0];
      
      const values = data.map(d => typeof d === 'object' ? d[dataKey] : d);
      const [min, max] = [Math.min(...values), Math.max(...values)];
      const padding = (max - min) * 0.1 || 1;
      
      const xScale = linearScale([0, data.length - 1], [0, width]);
      const yScale = linearScale([min - padding, max + padding], [height, 0]);
      
      const pathD = values
        .map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`)
        .join(' ');
      
      const areaD = pathD + ` L ${width} ${height} L 0 ${height} Z`;
      
      const glowId = `glow-${Math.random().toString(36).substr(2, 9)}`;
      
      return (
        <svg width={width} height={height} style={{ display: 'block' }}>
          {glow && (
            <defs>
              <filter id={glowId} x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
          )}
          {fill && (
            <path d={areaD} fill={lineColor} opacity={0.1} />
          )}
          <path
            d={pathD}
            fill="none"
            stroke={lineColor}
            strokeWidth={strokeWidth}
            strokeLinecap="round"
            strokeLinejoin="round"
            filter={glow ? `url(#${glowId})` : undefined}
          />
        </svg>
      );
    };

    // ============================================
    // KPI CARD
    // ============================================
    const KpiCard = ({ 
      label, 
      value, 
      delta, 
      data, 
      dataKey = 'value',
      theme,
      format = (v) => v.toLocaleString(),
    }) => {
      const t = themes[theme];
      const isPositive = delta >= 0;
      const deltaColor = isPositive ? t.positive : t.negative;
      
      return (
        <div style={{
          backgroundColor: t.bgCard,
          borderRadius: '12px',
          padding: '20px',
          border: `1px solid ${t.border}`,
          minWidth: '200px',
        }}>
          <div style={{ 
            fontSize: '13px', 
            color: t.textSecondary, 
            marginBottom: '8px',
            fontWeight: 500,
          }}>
            {label}
          </div>
          
          <div style={{ display: 'flex', alignItems: 'baseline', gap: '12px', marginBottom: '12px' }}>
            <span style={{ 
              fontSize: '32px', 
              fontWeight: 700, 
              color: t.text,
              letterSpacing: '-0.02em',
            }}>
              {format(value)}
            </span>
            
            {delta !== undefined && (
              <span style={{ 
                fontSize: '14px', 
                fontWeight: 600, 
                color: deltaColor,
                display: 'flex',
                alignItems: 'center',
                gap: '2px',
              }}>
                <span style={{ fontSize: '12px' }}>{isPositive ? '↗' : '↘'}</span>
                {Math.abs(delta).toFixed(2)}%
              </span>
            )}
          </div>
          
          {data && (
            <Sparkline 
              data={data} 
              dataKey={dataKey}
              width={160} 
              height={32} 
              theme={theme}
              color={t.colors[0]}
              fill={true}
              strokeWidth={1.5}
            />
          )}
        </div>
      );
    };

    // ============================================
    // MULTI-SERIES MONITOR LINE
    // ============================================
    const MonitorLine = ({ 
      data,
      series,
      width = 600, 
      height = 260, 
      theme,
      timeKey = 'time',
      unit = 'ms',
    }) => {
      const t = themes[theme];
      const svgRef = useRef(null);
      const [mouseX, setMouseX] = useState(null);
      const [visibleSeries, setVisibleSeries] = useState(() => 
        series.reduce((acc, s) => ({ ...acc, [s.key]: true }), {})
      );
      
      const margin = { top: 60, right: 20, bottom: 40, left: 60 };
      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;
      
      // Calculate max across all visible series
      const visibleKeys = series.filter(s => visibleSeries[s.key]).map(s => s.key);
      const allValues = data.flatMap(d => visibleKeys.map(k => d[k]));
      const max = Math.max(...allValues, 0.1);
      const padding = max * 0.15;
      
      const xScale = linearScale([0, data.length - 1], [0, chartWidth]);
      const yScale = linearScale([0, max + padding], [chartHeight, 0]);
      
      const yTicks = [0, (max + padding) * 0.5, max + padding].map(v => Math.round(v * 10) / 10);
      
      // Mouse handlers
      const handleMouseMove = useCallback((e) => {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - margin.left;
        if (x >= 0 && x <= chartWidth) {
          setMouseX(x);
        }
      }, [chartWidth, margin.left]);
      
      const handleMouseLeave = useCallback(() => {
        setMouseX(null);
      }, []);
      
      const toggleSeries = (key) => {
        setVisibleSeries(prev => ({ ...prev, [key]: !prev[key] }));
      };
      
      const glowId = `monitor-glow-${useMemo(() => Math.random().toString(36).substr(2, 9), [])}`;
      
      // Get interpolated values at mouse position
      const tooltipData = useMemo(() => {
        if (mouseX === null) return null;
        
        return series
          .filter(s => visibleSeries[s.key])
          .map(s => {
            const { y, value } = interpolateY(data, s.key, mouseX, xScale, yScale);
            return { ...s, y, value };
          });
      }, [mouseX, data, series, visibleSeries, xScale, yScale]);
      
      return (
        <div style={{
          backgroundColor: t.bgCard,
          borderRadius: '12px',
          padding: '20px',
          border: `1px solid ${t.border}`,
        }}>
          {/* Legend / Toggle buttons */}
          <div style={{ 
            display: 'flex', 
            gap: '12px', 
            marginBottom: '16px',
            flexWrap: 'wrap',
          }}>
            {series.map((s, i) => {
              const isVisible = visibleSeries[s.key];
              const color = t.colors[i % t.colors.length];
              
              return (
                <button
                  key={s.key}
                  onClick={() => toggleSeries(s.key)}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                    padding: '6px 12px',
                    backgroundColor: isVisible ? `${color}15` : t.bgSecondary,
                    borderRadius: '6px',
                    border: `1px solid ${isVisible ? color : t.border}`,
                    cursor: 'pointer',
                    transition: 'all 0.15s ease',
                    opacity: isVisible ? 1 : 0.5,
                  }}
                >
                  <div style={{
                    width: '8px',
                    height: '8px',
                    borderRadius: '50%',
                    backgroundColor: color,
                    opacity: isVisible ? 1 : 0.3,
                  }} />
                  <span style={{ 
                    fontSize: '12px', 
                    color: isVisible ? t.text : t.textSecondary,
                    fontFamily: 'JetBrains Mono, monospace',
                    fontWeight: 500,
                  }}>
                    {s.label}:
                  </span>
                  <span style={{ 
                    fontSize: '12px', 
                    color: isVisible ? t.text : t.textMuted,
                    fontWeight: 600,
                    fontFamily: 'JetBrains Mono, monospace',
                  }}>
                    {s.displayValue}
                  </span>
                </button>
              );
            })}
          </div>
          
          <svg 
            ref={svgRef}
            width={width} 
            height={height}
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            style={{ cursor: 'crosshair' }}
          >
            <defs>
              <filter id={glowId} x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            
            <g transform={`translate(${margin.left}, ${margin.top})`}>
              {/* Grid lines */}
              {yTicks.map((tick, i) => (
                <line
                  key={i}
                  x1={0}
                  y1={yScale(tick)}
                  x2={chartWidth}
                  y2={yScale(tick)}
                  stroke={t.gridLine}
                  strokeWidth={1}
                  strokeDasharray="4,4"
                />
              ))}
              
              {/* Y axis labels */}
              {yTicks.map((tick, i) => (
                <text
                  key={i}
                  x={-12}
                  y={yScale(tick)}
                  textAnchor="end"
                  dominantBaseline="middle"
                  fill={t.textMuted}
                  style={{ fontSize: '11px', fontFamily: 'JetBrains Mono, monospace' }}
                >
                  {tick.toFixed(1)} {unit}
                </text>
              ))}
              
              {/* X axis labels */}
              {[0, Math.floor(data.length / 2), data.length - 1].map((tick, i) => (
                <text
                  key={i}
                  x={xScale(tick)}
                  y={chartHeight + 24}
                  textAnchor="middle"
                  fill={t.textMuted}
                  style={{ fontSize: '11px', fontFamily: 'JetBrains Mono, monospace' }}
                >
                  {data[tick]?.[timeKey]}
                </text>
              ))}
              
              {/* Lines for each series */}
              {series.map((s, i) => {
                if (!visibleSeries[s.key]) return null;
                const color = t.colors[i % t.colors.length];
                
                const pathD = data
                  .map((d, idx) => `${idx === 0 ? 'M' : 'L'} ${xScale(idx)} ${yScale(d[s.key])}`)
                  .join(' ');
                
                return (
                  <path
                    key={s.key}
                    d={pathD}
                    fill="none"
                    stroke={color}
                    strokeWidth={1.5}
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    filter={`url(#${glowId})`}
                    style={{
                      transition: 'opacity 0.2s ease',
                    }}
                  />
                );
              })}
              
              {/* Smooth tracking cursor line */}
              {mouseX !== null && (
                <line
                  x1={mouseX}
                  y1={0}
                  x2={mouseX}
                  y2={chartHeight}
                  stroke={t.text}
                  strokeWidth={1}
                  opacity={0.2}
                  style={{ transition: 'x1 0.05s ease-out, x2 0.05s ease-out' }}
                />
              )}
              
              {/* Tracking dots for each series */}
              {tooltipData && tooltipData.map((s, i) => (
                <circle
                  key={s.key}
                  cx={mouseX}
                  cy={s.y}
                  r={4}
                  fill={t.bgCard}
                  stroke={t.colors[series.findIndex(ser => ser.key === s.key) % t.colors.length]}
                  strokeWidth={2}
                  style={{ transition: 'cy 0.05s ease-out' }}
                />
              ))}
            </g>
          </svg>
          
          {/* Floating tooltip */}
          {tooltipData && mouseX !== null && (
            <div 
              style={{
                position: 'absolute',
                top: margin.top + 10,
                left: margin.left + mouseX + 40,
                backgroundColor: t.bgCard,
                border: `1px solid ${t.border}`,
                borderRadius: '8px',
                padding: '12px',
                boxShadow: '0 4px 20px rgba(0,0,0,0.4)',
                pointerEvents: 'none',
                zIndex: 10,
                minWidth: '120px',
                transition: 'left 0.05s ease-out, opacity 0.1s ease',
              }}
            >
              {tooltipData.map((s, i) => (
                <div key={s.key} style={{ 
                  display: 'flex', 
                  alignItems: 'center', 
                  gap: '8px',
                  marginBottom: i < tooltipData.length - 1 ? '6px' : 0,
                }}>
                  <div style={{
                    width: '8px',
                    height: '8px',
                    borderRadius: '50%',
                    backgroundColor: t.colors[series.findIndex(ser => ser.key === s.key) % t.colors.length],
                  }} />
                  <span style={{ 
                    fontSize: '12px', 
                    color: t.textSecondary,
                    fontFamily: 'JetBrains Mono, monospace',
                  }}>
                    {s.label}
                  </span>
                  <span style={{ 
                    fontSize: '12px', 
                    color: t.text,
                    fontWeight: 600,
                    fontFamily: 'JetBrains Mono, monospace',
                    marginLeft: 'auto',
                  }}>
                    {s.value.toFixed(2)} {unit}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // SPIKE CHART
    // ============================================
    const SpikeChart = ({ 
      data, 
      dataKey = 'value',
      timeKey = 'time',
      width = 600, 
      height = 200, 
      theme,
      baselineColor,
      label = 'Allowed Requests',
    }) => {
      const t = themes[theme];
      const svgRef = useRef(null);
      const [mouseX, setMouseX] = useState(null);
      
      const margin = { top: 20, right: 20, bottom: 40, left: 40 };
      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;
      
      const values = data.map(d => d[dataKey]);
      const max = Math.max(...values) || 1;
      
      const xScale = linearScale([0, data.length - 1], [0, chartWidth]);
      const yScale = linearScale([0, max + 0.5], [chartHeight, 0]);
      
      const pathD = data
        .map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(d[dataKey])}`)
        .join(' ');
      
      const yTicks = Array.from({ length: max + 1 }, (_, i) => i);
      const xTicks = [0, Math.floor(data.length * 0.33), Math.floor(data.length * 0.66), data.length - 1];
      
      const handleMouseMove = useCallback((e) => {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - margin.left;
        if (x >= 0 && x <= chartWidth) {
          setMouseX(x);
        }
      }, [chartWidth, margin.left]);
      
      const handleMouseLeave = useCallback(() => {
        setMouseX(null);
      }, []);
      
      // Interpolated value at mouse position
      const tooltipData = useMemo(() => {
        if (mouseX === null) return null;
        const { y, value } = interpolateY(data, dataKey, mouseX, xScale, yScale);
        
        // Find nearest time label
        const xInverse = inverseLinearScale([0, data.length - 1], [0, chartWidth]);
        const nearestIndex = Math.round(xInverse(mouseX));
        const clampedIndex = Math.max(0, Math.min(data.length - 1, nearestIndex));
        
        return { y, value: Math.round(value), time: data[clampedIndex][timeKey] };
      }, [mouseX, data, dataKey, xScale, yScale, chartWidth, timeKey]);
      
      return (
        <div style={{
          backgroundColor: t.bgCard,
          borderRadius: '12px',
          padding: '20px',
          border: `1px solid ${t.border}`,
          position: 'relative',
        }}>
          <svg 
            ref={svgRef}
            width={width} 
            height={height}
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            style={{ cursor: 'crosshair' }}
          >
            <g transform={`translate(${margin.left}, ${margin.top})`}>
              {/* Y axis labels */}
              {yTicks.map((tick, i) => (
                <text
                  key={i}
                  x={-12}
                  y={yScale(tick)}
                  textAnchor="end"
                  dominantBaseline="middle"
                  fill={t.textMuted}
                  style={{ fontSize: '12px' }}
                >
                  {tick}
                </text>
              ))}
              
              {/* X axis labels */}
              {xTicks.map((tick, i) => (
                <text
                  key={i}
                  x={xScale(tick)}
                  y={chartHeight + 24}
                  textAnchor="middle"
                  fill={t.textMuted}
                  style={{ fontSize: '11px' }}
                >
                  {data[tick]?.[timeKey]}
                </text>
              ))}
              
              {/* Baseline */}
              <line
                x1={0}
                y1={chartHeight}
                x2={chartWidth}
                y2={chartHeight}
                stroke={baselineColor || t.baseline || t.colors[4]}
                strokeWidth={2}
              />
              
              {/* Line */}
              <path
                d={pathD}
                fill="none"
                stroke={t.colors[0]}
                strokeWidth={2}
                strokeLinecap="round"
                strokeLinejoin="round"
              />
              
              {/* Smooth tracking cursor line */}
              {mouseX !== null && (
                <>
                  <line
                    x1={mouseX}
                    y1={0}
                    x2={mouseX}
                    y2={chartHeight}
                    stroke={t.text}
                    strokeWidth={1}
                    opacity={0.3}
                    style={{ transition: 'x1 0.05s ease-out, x2 0.05s ease-out' }}
                  />
                  {tooltipData && (
                    <circle
                      cx={mouseX}
                      cy={tooltipData.y}
                      r={5}
                      fill={t.colors[0]}
                      style={{ transition: 'cy 0.05s ease-out' }}
                    />
                  )}
                </>
              )}
            </g>
          </svg>
          
          {/* Tooltip */}
          {tooltipData && mouseX !== null && (
            <div 
              style={{
                position: 'absolute',
                top: margin.top,
                left: Math.min(margin.left + mouseX + 16, width - 180),
                backgroundColor: t.bgCard,
                border: `1px solid ${t.border}`,
                borderRadius: '8px',
                padding: '12px',
                boxShadow: '0 4px 20px rgba(0,0,0,0.4)',
                pointerEvents: 'none',
                zIndex: 10,
                transition: 'left 0.05s ease-out',
              }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' }}>
                <div style={{
                  width: '8px',
                  height: '8px',
                  borderRadius: '50%',
                  backgroundColor: t.colors[0],
                }} />
                <span style={{ fontSize: '13px', color: t.text, fontWeight: 500 }}>
                  {label}
                </span>
                <span style={{ fontSize: '13px', color: t.text, fontWeight: 700 }}>
                  {tooltipData.value}
                </span>
              </div>
              <div style={{ fontSize: '12px', color: t.textSecondary }}>
                {tooltipData.time}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // MINI AREA SPARKLINE
    // ============================================
    const MiniArea = ({ 
      data, 
      dataKey = 'value',
      width = 160, 
      height = 40, 
      theme,
      color,
    }) => {
      const t = themes[theme];
      const lineColor = color || t.colors[0];
      
      const values = data.map(d => typeof d === 'object' ? d[dataKey] : d);
      const [min, max] = [Math.min(...values), Math.max(...values)];
      const range = max - min || 1;
      
      const xScale = linearScale([0, data.length - 1], [0, width]);
      const yScale = linearScale([min - range * 0.1, max + range * 0.1], [height, 0]);
      
      const pathD = values
        .map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(v)}`)
        .join(' ');
      
      const areaD = pathD + ` L ${width} ${height} L 0 ${height} Z`;
      
      const gradientId = `mini-area-${useMemo(() => Math.random().toString(36).substr(2, 9), [])}`;
      
      return (
        <svg width={width} height={height} style={{ display: 'block' }}>
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={lineColor} stopOpacity={0.15} />
              <stop offset="100%" stopColor={lineColor} stopOpacity={0} />
            </linearGradient>
          </defs>
          <path d={areaD} fill={`url(#${gradientId})`} />
          <path
            d={pathD}
            fill="none"
            stroke={lineColor}
            strokeWidth={1.5}
            strokeLinecap="round"
            strokeLinejoin="round"
          />
        </svg>
      );
    };

    // ============================================
    // DEMO DATA GENERATORS
    // ============================================
    const generateMultiSeriesData = () => {
      const data = [];
      const times = ['09:00', '12:00', '15:00', '18:00', '21:00', '00:00', '03:00', '06:00'];
      
      for (let i = 0; i < 80; i++) {
        const timeIndex = Math.floor(i / 10);
        const base = 1.5;
        
        data.push({
          time: times[timeIndex] || '08:00',
          p50: base + Math.random() * 0.3,
          p95: base + 0.5 + Math.random() * 0.8,
          p99: base + 1.2 + Math.random() * 1.5 + (i > 40 && i < 55 ? Math.random() * 2 : 0),
          p999: base + 2 + Math.random() * 2.5 + (i > 40 && i < 55 ? Math.random() * 3 : 0),
          max: base + 3 + Math.random() * 3 + (i > 40 && i < 55 ? Math.random() * 4 : 0),
        });
      }
      return data;
    };

    const generateSpikeData = () => {
      const data = [];
      const baseTime = new Date();
      baseTime.setHours(7, 12, 0, 0);
      
      for (let i = 0; i < 60; i++) {
        const time = new Date(baseTime.getTime() + i * 60000);
        const timeStr = time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        
        let value = 0;
        if (Math.random() > 0.85) {
          value = Math.floor(Math.random() * 4) + 1;
        }
        
        data.push({ time: timeStr, value });
      }
      return data;
    };

    const generateKpiData = () => {
      const data = [];
      for (let i = 0; i < 20; i++) {
        data.push({ value: 2000000 + Math.random() * 1000000 });
      }
      return data;
    };

    // ============================================
    // DEMO APPLICATION
    // ============================================
    function App() {
      const [currentTheme, setCurrentTheme] = useState('monitor-dark');
      const t = themes[currentTheme];
      
      const multiSeriesData = useMemo(() => generateMultiSeriesData(), []);
      const spikeData = useMemo(() => generateSpikeData(), []);
      const requestsData = useMemo(() => generateKpiData(), []);
      const loadTimeData = useMemo(() => generateKpiData().map(d => ({ value: 800 + Math.random() * 500 })), []);

      const monitorSeries = [
        { key: 'p50', label: 'p50', displayValue: '1.8 ms' },
        { key: 'p95', label: 'p95', displayValue: '2.1 ms' },
        { key: 'p99', label: 'p99', displayValue: '3.2 ms' },
        { key: 'p999', label: 'p99.9', displayValue: '5.1 ms' },
        { key: 'max', label: 'max', displayValue: '7.8 ms' },
      ];

      return (
        <div style={{
          backgroundColor: t.bg,
          color: t.text,
          minHeight: '100vh',
          transition: 'all 0.3s ease',
        }}>
          {/* Header */}
          <header style={{ 
            borderBottom: `1px solid ${t.border}`, 
            padding: '20px 40px',
            position: 'sticky',
            top: 0,
            backgroundColor: t.bg,
            zIndex: 100,
          }}>
            <div style={{ 
              maxWidth: '1400px', 
              margin: '0 auto', 
              display: 'flex', 
              justifyContent: 'space-between', 
              alignItems: 'center',
              flexWrap: 'wrap',
              gap: '16px',
            }}>
              <div>
                <h1 style={{ 
                  fontSize: '22px', 
                  fontWeight: 700,
                  color: t.text,
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                }}>
                  <span style={{ color: t.accent }}>●</span>
                  ChartKit
                </h1>
              </div>
              
              <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                {Object.entries(themes).map(([key, theme]) => (
                  <button
                    key={key}
                    onClick={() => setCurrentTheme(key)}
                    style={{
                      padding: '8px 14px',
                      borderRadius: '6px',
                      border: currentTheme === key ? `1px solid ${t.accent}` : `1px solid ${t.border}`,
                      backgroundColor: currentTheme === key ? `${t.accent}15` : 'transparent',
                      color: currentTheme === key ? t.accent : t.textSecondary,
                      cursor: 'pointer',
                      fontSize: '12px',
                      fontWeight: 500,
                      transition: 'all 0.15s ease',
                    }}
                  >
                    {theme.name}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main style={{ padding: '40px', maxWidth: '1400px', margin: '0 auto' }}>
            
            {/* Section: KPI Cards */}
            <section style={{ marginBottom: '48px' }}>
              <h2 style={{ 
                fontSize: '13px', 
                fontWeight: 600, 
                color: t.textSecondary, 
                marginBottom: '16px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
              }}>
                KPI Cards with Sparklines
              </h2>
              
              <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
                <KpiCard 
                  label="Requests"
                  value={2780000}
                  delta={92.35}
                  data={requestsData}
                  theme={currentTheme}
                  format={(v) => `${(v / 1000000).toFixed(2)}M`}
                />
                <KpiCard 
                  label="Page load time"
                  value={1053}
                  delta={-40.01}
                  data={loadTimeData}
                  theme={currentTheme}
                  format={(v) => `${v.toLocaleString()}ms`}
                />
                <KpiCard 
                  label="Error rate"
                  value={0.12}
                  delta={-8.5}
                  data={loadTimeData.map(d => ({ value: Math.random() * 0.5 }))}
                  theme={currentTheme}
                  format={(v) => `${v.toFixed(2)}%`}
                />
              </div>
            </section>
            
            {/* Section: Sparklines */}
            <section style={{ marginBottom: '48px' }}>
              <h2 style={{ 
                fontSize: '13px', 
                fontWeight: 600, 
                color: t.textSecondary, 
                marginBottom: '16px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
              }}>
                Sparkline Variants
              </h2>
              
              <div style={{ 
                display: 'flex', 
                gap: '24px', 
                flexWrap: 'wrap',
                padding: '24px',
                backgroundColor: t.bgCard,
                borderRadius: '12px',
                border: `1px solid ${t.border}`,
              }}>
                <div>
                  <div style={{ fontSize: '11px', color: t.textSecondary, marginBottom: '8px' }}>Default</div>
                  <Sparkline data={multiSeriesData} dataKey="p50" theme={currentTheme} width={140} height={36} />
                </div>
                <div>
                  <div style={{ fontSize: '11px', color: t.textSecondary, marginBottom: '8px' }}>With Glow</div>
                  <Sparkline data={multiSeriesData} dataKey="p50" theme={currentTheme} width={140} height={36} glow={true} />
                </div>
                <div>
                  <div style={{ fontSize: '11px', color: t.textSecondary, marginBottom: '8px' }}>With Fill</div>
                  <Sparkline data={multiSeriesData} dataKey="p50" theme={currentTheme} width={140} height={36} fill={true} />
                </div>
                <div>
                  <div style={{ fontSize: '11px', color: t.textSecondary, marginBottom: '8px' }}>Mini Area</div>
                  <MiniArea data={multiSeriesData} dataKey="p50" theme={currentTheme} width={140} height={36} />
                </div>
                <div>
                  <div style={{ fontSize: '11px', color: t.textSecondary, marginBottom: '8px' }}>Alt Color</div>
                  <Sparkline data={multiSeriesData} dataKey="p99" theme={currentTheme} width={140} height={36} color={t.colors[2]} glow={true} />
                </div>
              </div>
            </section>

            {/* Section: Monitor Chart */}
            <section style={{ marginBottom: '48px', position: 'relative' }}>
              <h2 style={{ 
                fontSize: '13px', 
                fontWeight: 600, 
                color: t.textSecondary, 
                marginBottom: '16px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
              }}>
                Latency Monitor (click badges to toggle)
              </h2>
              
              <MonitorLine 
                data={multiSeriesData}
                series={monitorSeries}
                timeKey="time"
                theme={currentTheme}
                width={Math.min(900, typeof window !== 'undefined' ? window.innerWidth - 120 : 900)}
                height={280}
                unit="ms"
              />
            </section>
            
            {/* Section: Spike Chart */}
            <section style={{ marginBottom: '48px' }}>
              <h2 style={{ 
                fontSize: '13px', 
                fontWeight: 600, 
                color: t.textSecondary, 
                marginBottom: '16px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
              }}>
                Event Spike Chart
              </h2>
              
              <SpikeChart 
                data={spikeData}
                dataKey="value"
                timeKey="time"
                theme={currentTheme}
                width={Math.min(900, typeof window !== 'undefined' ? window.innerWidth - 120 : 900)}
                height={220}
              />
            </section>

            {/* Color Palette */}
            <section>
              <h2 style={{ 
                fontSize: '13px', 
                fontWeight: 600, 
                color: t.textSecondary, 
                marginBottom: '16px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
              }}>
                Theme Palette: {t.name}
              </h2>
              
              <div style={{ 
                display: 'flex', 
                gap: '12px', 
                flexWrap: 'wrap',
                padding: '20px',
                backgroundColor: t.bgCard,
                borderRadius: '12px',
                border: `1px solid ${t.border}`,
              }}>
                {t.colors.map((color, i) => (
                  <div key={i} style={{ textAlign: 'center' }}>
                    <div style={{
                      width: '48px',
                      height: '48px',
                      borderRadius: '8px',
                      backgroundColor: color,
                      marginBottom: '8px',
                    }} />
                    <span style={{ 
                      fontSize: '10px', 
                      color: t.textSecondary,
                      fontFamily: 'JetBrains Mono, monospace',
                    }}>
                      {color}
                    </span>
                  </div>
                ))}
              </div>
            </section>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
