name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: bench
      - run: npx playwright install --with-deps chromium
        working-directory: bench
      - run: npm test
      - run: npm run build:lib
      - run: npm run showcase:check -- --check
      - run: npm run size

  web:
    name: Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=chartkit-web
      - run: npm run build:web
