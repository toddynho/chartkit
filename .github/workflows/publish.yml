# Manual publish only. Nothing here runs on push or tag.
# Provenance requires GitHub Actions OIDC (id-token: write) and npm >= 9.
# Set the NPM_TOKEN secret to an automation token that can publish
# @chartkitdev/* (the chartkitdev org) and @derpdaderp/chartkit (the shim).
# Trusted publishing can omit NPM_TOKEN once npm grants this repo access.
# "all" publishes in dependency order. dry_run packs and contacts the registry
# without uploading, and skips provenance.

name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - "@chartkitdev/core"
          - "@chartkitdev/geo"
          - "@chartkitdev/react"
          - "@chartkitdev/vue"
          - "@chartkitdev/svelte"
          - "@chartkitdev/vanilla"
          - "@chartkitdev/element"
          - "@chartkitdev/markdown"
          - "@chartkitdev/mcp"
          - "@derpdaderp/chartkit"
          - all
      dry_run:
        description: Pack and check the registry upload without publishing
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Release check
        run: npm run release:check

      - name: Publish selected package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          dry="${{ inputs.dry_run }}"
          publish() {
            local name="$1"
            if [[ "${dry}" == "true" ]]; then
              echo "Dry run ${name}"
              npm publish --workspace "${name}" --access public --dry-run
            else
              echo "Publishing ${name} with provenance"
              npm publish --workspace "${name}" --access public --provenance
            fi
          }
          case "${{ inputs.package }}" in
            all)
              publish "@chartkitdev/core"
              publish "@chartkitdev/geo"
              publish "@chartkitdev/react"
              publish "@chartkitdev/vue"
              publish "@chartkitdev/svelte"
              publish "@chartkitdev/vanilla"
              publish "@chartkitdev/element"
              publish "@chartkitdev/markdown"
              publish "@chartkitdev/mcp"
              publish "@derpdaderp/chartkit"
              ;;
            *)
              publish "${{ inputs.package }}"
              ;;
          esac
