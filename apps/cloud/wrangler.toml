# ChartKit Cloud on Cloudflare Workers.
# `npm run deploy` bundles src/worker.ts to dist/worker.js, then runs `wrangler deploy`.
# Deploy from a shell that has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# This file has no secrets. Do not put the API token here.
name = "chartkit-cloud"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# workers.dev URL: https://chartkit-cloud.<account-subdomain>.workers.dev
# Wrangler prints the real host. The account subdomain is not stored in this repo.

# Custom hostname. The chartkit.dev zone is on the same account as this worker.
# Deploy fails if the zone is not on the account the deploy runs against.
[[routes]]
pattern = "cloud.chartkit.dev"
custom_domain = true

# Runtime secrets, set with `wrangler secret put`, never in this file:
# KV_REST_API_URL, KV_REST_API_TOKEN (Vercel KV or Upstash). Only needed when CHARTKIT_KV is not bound.
# CHARTKIT_DEV_KEYS (comma-separated keys that remove the mark; works alongside KV)
# STRIPE_SECRET_KEY, STRIPE_PRICE_ID, STRIPE_WEBHOOK_SECRET (checkout stays off until these exist)
# CHARTKIT_ALLOW_MEMORY=1 lets /health pass with no durable store. Smoke tests only.

# Durable store for API keys and stored charts (/c/<id>). Read before the REST vars above.
# Without it (or the REST vars), /health answers 503 on Workers: keys and /c/<id> links would vanish with the isolate.
# Created with `npx wrangler kv namespace create CHARTKIT_KV`. The id names the namespace; it is not a secret.
[[kv_namespaces]]
binding = "CHARTKIT_KV"
id = "532ee8b3b649457c81896f3daf49ca2e"

# Rate limit: 120 requests a minute per client IP, on every route but /health and checkout.
# Counters are shared by the isolates in one Cloudflare location, not exact across the globe.
# namespace_id is any positive integer that is unique within the account. Nothing has to be created first.
# Without this binding the worker falls back to a per-isolate memory counter.
[[ratelimits]]
name = "CHARTKIT_RATE_LIMIT"
namespace_id = "1201"
simple = { limit = 120, period = 60 }

# Hashed image bytes. Not read by the worker yet.
# Repeats use the content hash, Cache-Control, and the Workers Cache API.
# [[r2_buckets]]
# binding = "CHARTKIT_CACHE"
# bucket_name = "chartkit-cloud-cache"

# wasm-bindgen needs the wasm bytes or a Module. Fonts are raw bytes.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
